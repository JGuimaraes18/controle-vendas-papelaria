services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: always
    env_file:
      - .env_prod
    command: sh -c "gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2"
    volumes:
      - static_volume:/app/staticfiles
    networks:
      - net_sales

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost}
    restart: always
    ports:
      - "80:80"
    volumes:
      - static_volume:/staticfiles
    networks:
      - net_sales

networks:
  net_sales:

volumes:
  pg_data:
  static_volume: